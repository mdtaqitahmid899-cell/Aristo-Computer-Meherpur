<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="aristo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164EA0" />
      <stop offset="100%" stop-color="#051228" />
    </linearGradient>
    <linearGradient id="aristo-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0.4" />
    </linearGradient>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#38BDF8" flood-opacity="0.75" />
    </filter>
  </defs>
  
  <!-- Outer Tech Squircle -->
  <rect x="14" y="14" width="484" height="484" rx="108" fill="url(#aristo-bg)" stroke="url(#aristo-border)" stroke-width="6" />
  <rect x="20" y="20" width="472" height="472" rx="102" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" />
  
  <!-- Circuit Emblem with Cyan Ambient Glow -->
  <image href="data:image/png;base64," x="82" y="125" width="348" height="261" filter="url(#cyan-glow)" />
</svg>